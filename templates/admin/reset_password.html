{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<h3>Reset Password for {{ user.username }}</h3>
<form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.password.label }} {{ form.password() }}</p>
    {{ form.submit() }}
</form>
<p><a href="{{ url_for('admin.manage_users') }}">Back to Manage Users</a></p>
{% endblock %}
